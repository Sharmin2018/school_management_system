{% extends "frontend/base.html" %}

{% block extra_css %}

<style>
    .page-image-wrapper {
        width: 900px !important;
        height: 400px !important;
        margin: 0 auto 25px;
        overflow: hidden;
        border-radius: 10px;
    }

    .page-image {
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        display: block;
    }
</style>

{% endblock %}
{% block content %}


<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-10">

            <h1 class="mb-4">{{ page.title }}</h1>

           {% if page.image %}
            <div class="page-image-wrapper mb-4">
            <img
            src="{{ page.image.url }}"
            alt="{{ page.title }}"
            class="page-image"
             >
            </div>
            {% endif %}

            <div class="page-content">
                {{ page.content|linebreaks }}
            </div>

        </div>
    </div>

</div>

{% endblock %}
