
{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h4 class="mb-0">{{ title }}</h4>
                </div>

                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}

                        {% for field in form %}
                            <div class="mb-3">
                                <label for="{{ field.id_for_label }}"
                                       class="form-label">
                                    {{ field.label }}
                                </label>

                                {{ field }}

                                {% if field.help_text %}
                                    <div class="form-text">
                                        {{ field.help_text }}
                                    </div>
                                {% endif %}

                                {% for error in field.errors %}
                                    <div class="text-danger small">
                                        {{ error }}
                                    </div>
                                {% endfor %}
                            </div>
                        {% endfor %}

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">
                                Save Statistic
                            </button>

                            <a href="{% url 'statistic_list' %}"
                               class="btn btn-secondary">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>

</div>
{% endblock %}
