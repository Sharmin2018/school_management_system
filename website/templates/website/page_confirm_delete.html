{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    <div class="card shadow-sm">
        <div class="card-body">

            <h3 class="mb-3">Delete Website Page</h3>

            <p>
                Are you sure you want to delete
                <strong>{{ page.title }}</strong>?
            </p>

            <form method="post">
                {% csrf_token %}

                <a href="{% url 'website_page_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

                <button type="submit" class="btn btn-danger">
                    Delete
                </button>
            </form>

        </div>
    </div>

</div>

{% endblock %}
